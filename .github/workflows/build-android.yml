name: Build Android APK

# Android (arm64-v8a) build of the recompiled game. Everything needed is in
# the repository (vendored SDK + committed generated code), so no game dump
# is required: the APK embeds the recompiled game code, and the player points
# the app at their own extracted game folder on first launch (the game data
# itself - default.xex and the bigfile archives - is never committed).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components (CMake 3.31.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "cmake;3.31.1" >/dev/null

      - name: Gradle assembleDebug (arm64-v8a)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK missing"; exit 1; }
          unzip -l "$APK" > /tmp/apk_contents.txt
          cat /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libmain.so" /tmp/apk_contents.txt || {
            echo "ERROR: libmain.so missing from APK"; exit 1; }
          grep -q "lib/arm64-v8a/librexruntime.so" /tmp/apk_contents.txt || {
            echo "ERROR: librexruntime.so missing from APK - the runtime would fail to load"; exit 1; }
          echo "OK: game library and runtime are packaged."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: simpsons-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
